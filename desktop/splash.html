<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Numora is getting ready</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI Variable", "Segoe UI", sans-serif;
      background: transparent;
      color: #efffff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { padding: 12px; background: transparent; -webkit-app-region: drag; }
    .shell {
      position: relative;
      isolation: isolate;
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(141, 244, 237, .22);
      border-radius: 25px;
      background:
        radial-gradient(ellipse at 50% 18%, rgba(17, 151, 159, .23), transparent 42%),
        linear-gradient(145deg, #09252d 0%, #07171f 52%, #0a2329 100%);
      box-shadow: 0 25px 90px rgba(0, 9, 16, .58), inset 0 1px rgba(255, 255, 255, .08);
    }
    .grid, .grid::after {
      position: absolute;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      content: "";
    }
    .grid {
      opacity: .2;
      background-image: linear-gradient(rgba(112, 232, 222, .16) 1px, transparent 1px), linear-gradient(90deg, rgba(112, 232, 222, .16) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to bottom, black, transparent 85%);
    }
    .grid::after {
      z-index: -1;
      opacity: .45;
      background: radial-gradient(circle at 50% 40%, transparent 10%, #07171f 83%);
    }
    .glow {
      position: absolute;
      z-index: -1;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      filter: blur(58px);
      opacity: .37;
      pointer-events: none;
      animation: drift 13s ease-in-out infinite alternate;
    }
    .glow-a { top: -104px; left: -58px; background: #09cbd0; }
    .glow-b { right: -105px; bottom: 12px; background: #2b9ea7; animation-delay: -5s; }
    .brand-line {
      position: absolute;
      top: 24px;
      left: 28px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #a5d8d7;
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .brand-line::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8ef1df;
      box-shadow: 0 0 13px #56e8dd;
      content: "";
    }
    .centerpiece {
      position: relative;
      display: flex;
      width: 100%;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 43px 40px 20px;
      text-align: center;
    }
    .logo-frame {
      position: relative;
      display: grid;
      width: 172px;
      height: 154px;
      place-items: center;
      overflow: hidden;
      border: 1px solid rgba(112, 232, 222, .18);
      border-radius: 28px;
      background: #071216;
      box-shadow: 0 0 0 8px rgba(79, 220, 218, .035), 0 15px 55px rgba(0, 212, 215, .14), inset 0 0 25px rgba(42, 226, 227, .06);
      animation: settle .9s cubic-bezier(.2,.75,.25,1) both, breathe 5s ease-in-out 1s infinite;
    }
    .logo-frame img { display: block; width: 148px; height: auto; border-radius: 4px; }
    .logo-scan {
      position: absolute;
      top: 12%;
      left: 4%;
      width: 92%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(163, 255, 246, .9), transparent);
      box-shadow: 0 0 15px 3px rgba(31, 235, 226, .25);
      animation: scan 3.6s cubic-bezier(.45,.05,.55,.95) infinite;
    }
    .orbit {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 195px;
      border: 1px solid rgba(85, 232, 221, .12);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotate(-28deg);
      pointer-events: none;
    }
    .orbit::after {
      position: absolute;
      top: 13%;
      left: 12%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #82f5e1;
      box-shadow: 0 0 12px 3px rgba(105, 245, 221, .65);
      content: "";
      animation: orbit 8s linear infinite;
      transform-origin: 84px 78px;
    }
    h1 {
      margin: 25px 0 0;
      font-size: 23px;
      font-weight: 620;
      letter-spacing: -.045em;
      line-height: 1.22;
    }
    h1 span { color: #7ce6da; }
    .subtitle {
      margin: 8px 0 0;
      color: #9bb9bb;
      font-size: 12px;
      letter-spacing: .015em;
    }
    .status {
      display: flex;
      width: min(420px, 100%);
      align-items: center;
      gap: 12px;
      margin-top: 25px;
      padding: 11px 13px;
      border: 1px solid rgba(178, 232, 227, .12);
      border-radius: 13px;
      background: rgba(235, 255, 253, .045);
      text-align: left;
    }
    .status-icon {
      position: relative;
      display: grid;
      width: 26px;
      height: 26px;
      flex: none;
      place-items: center;
      border: 1px solid rgba(122, 239, 221, .25);
      border-radius: 9px;
      color: #8ef1dd;
    }
    .status-icon::before, .status-icon::after {
      position: absolute;
      width: 8px;
      height: 8px;
      border: 1px solid currentColor;
      border-radius: 3px;
      content: "";
      animation: pulse 1.8s ease-in-out infinite;
    }
    .status-icon::after { width: 3px; height: 3px; background: currentColor; animation-delay: -.9s; }
    .status-copy { min-width: 0; }
    .status-copy strong { display: block; color: #e3f6f3; font-size: 11px; font-weight: 620; }
    .status-copy small { display: block; overflow: hidden; margin-top: 3px; color: #8ba9ab; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
    .status-light { width: 6px; height: 6px; margin-left: auto; border-radius: 50%; background: #6de7c2; box-shadow: 0 0 12px #5ce8c3; }
    .progress { position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; overflow: hidden; background: rgba(109, 231, 194, .08); }
    .progress i { display: block; width: 36%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #3bddd4, #a9f7c5, transparent); animation: progress 2s cubic-bezier(.65,.05,.35,.95) infinite; }
    .footer {
      display: flex;
      width: calc(100% - 56px);
      align-items: center;
      justify-content: space-between;
      margin: 0 28px 20px;
      color: #658486;
      font-size: 9px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .footer .privacy { display: flex; align-items: center; gap: 6px; letter-spacing: .04em; text-transform: none; }
    .footer svg { width: 12px; height: 12px; color: #78ddce; }
    .is-leaving .shell { animation: fade-out .24s ease-in forwards; }
    @keyframes drift { to { transform: translate(28px, 34px) scale(1.15); opacity: .52; } }
    @keyframes settle { from { transform: translateY(10px) scale(.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes breathe { 50% { box-shadow: 0 0 0 12px rgba(79, 220, 218, .025), 0 15px 64px rgba(0, 212, 215, .19), inset 0 0 25px rgba(42, 226, 227, .08); } }
    @keyframes scan { 0%, 8% { top: 12%; opacity: 0; } 15% { opacity: .9; } 84% { opacity: .8; } 100% { top: 88%; opacity: 0; } }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(.78); opacity: .5; } 50% { transform: scale(1.12); opacity: 1; } }
    @keyframes progress { from { transform: translateX(-110%); } to { transform: translateX(290%); } }
    @keyframes fade-out { to { opacity: 0; transform: scale(.985); filter: blur(5px); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="grid" aria-hidden="true"></div>
    <div class="glow glow-a" aria-hidden="true"></div>
    <div class="glow glow-b" aria-hidden="true"></div>
    <div class="brand-line">Private by design</div>
    <section class="centerpiece" aria-label="Numora startup">
      <div class="orbit" aria-hidden="true"></div>
      <div class="logo-frame">
        <img src="numora-wordmark.png" alt="Numora">
        <span class="logo-scan" aria-hidden="true"></span>
      </div>
      <h1>Your money.<br><span>Your control.</span></h1>
      <p class="subtitle">Private expense tracking, ready when you are.</p>
      <div class="status" role="status" aria-live="polite">
        <span class="status-icon" aria-hidden="true"></span>
        <span class="status-copy"><strong data-stage>Preparing your private workspace</strong><small data-detail>Starting Numora’s local services.</small></span>
        <span class="status-light" aria-hidden="true"></span>
      </div>
    </section>
    <footer class="footer">
      <span>Numora</span>
      <span class="privacy"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 2.5 16 5v4.7c0 4-2.6 6.4-6 7.8-3.4-1.4-6-3.8-6-7.8V5l6-2.5Z" stroke="currentColor" stroke-width="1.4"/><path d="m7.5 10 1.6 1.6 3.5-3.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Everything stays on this device</span>
    </footer>
    <div class="progress" aria-hidden="true"><i></i></div>
  </main>
</body>
</html>
